services:
  ekco-alert:
    build: .
    container_name: ekco-alert
    command: python ekco_alert.py
    restart: on-failure
    volumes:
      - ekco-heartbeats:/app/heartbeats
    healthcheck:
      test: ["CMD-SHELL", "test $$(($$(date +%s) - $$(stat -c %Y /app/heartbeats/ekco_alert.timestamp))) -lt 45 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 10s

